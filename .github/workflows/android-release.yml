name: Android Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure secrets placeholders
        run: cp .env.example app/.env.example

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -x lint --no-daemon --max-workers=2

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          ls -la "$APK"
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify "$APK" && echo SIGNATURE_OK

      - name: Prepare release assets
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "Chort-${GITHUB_REF_NAME}-release.apk"
          cp "$APK" "Chort-latest.apk"
          sha256sum "Chort-${GITHUB_REF_NAME}-release.apk" | tee checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Chort-*-release.apk
            Chort-latest.apk
            checksums.txt
          body: |
            ## Chort ${{ github.ref_name }} - Auth + New Experience

            Sign-in with Google, Facebook, phone number (SMS code), or email.
            One account per human; methods link safely. Phone-based recovery.
            See AUTH_SETUP.md for the required Vercel env vars + Facebook App ID.
            Signed with the repo dev-release key (use your upload key for Play).
