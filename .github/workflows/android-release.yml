name: Android Release APK

# ZEVORA 3.0.0 rebuild pipeline.
# Builds, signs and verifies a release APK straight from the pushed commit, then
# publishes it as a downloadable artifact (and attaches it to the GitHub Release
# when a v* tag is pushed). This is why a stale APK can no longer be shipped:
# the artifact is rebuilt from source on every release.
#
# Signing policy (strict):
#   - The APK is ALWAYS signed with the stable production keystore stored in
#     GitHub Secrets. A per-build throwaway key is FORBIDDEN: it would force
#     every user to uninstall before each update.
#   - No private key material is ever committed to this repository.
#   - The workflow FAILS (no APK shipped) when no production key is configured.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the commit stamp is meaningful)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installed manually instead of via a third-party action: the SDK tools are
      # pinned so the runner cannot silently pick a cmdline-tools build that
      # requires a newer JDK (that broke an earlier run of this workflow).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "build-tools;36.0.0"

      - name: Read version + commit
        id: meta
        run: |
          echo "code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure stable production signing
        env:
          KS_PRIMARY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP_PRIMARY: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AL_PRIMARY: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP_PRIMARY: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_FALLBACK: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SP_FALLBACK: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          AL_FALLBACK: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KP_FALLBACK: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KS_PRIMARY:-}" ] && [ -n "${SP_PRIMARY:-}" ]; then
            echo "ZEVORA signing: primary production key (ANDROID_KEYSTORE_BASE64)"
            KS="$KS_PRIMARY"; SP="$SP_PRIMARY"
            AL="${AL_PRIMARY:-upload}"; KP="${KP_PRIMARY:-$SP_PRIMARY}"
          elif [ -n "${KS_FALLBACK:-}" ] && [ -n "${SP_FALLBACK:-}" ]; then
            echo "ZEVORA signing: fallback production key (ANDROID_RELEASE_KEYSTORE_BASE64)"
            KS="$KS_FALLBACK"; SP="$SP_FALLBACK"
            AL="${AL_FALLBACK:-upload}"; KP="${KP_FALLBACK:-$SP_FALLBACK}"
          else
            echo "::error::No production keystore configured. Set ANDROID_KEYSTORE_BASE64 + ANDROID_STORE_PASSWORD in GitHub Secrets (repository Settings > Secrets and variables > Actions). Refusing to ship an APK signed with any other key."
            exit 1
          fi
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/zevora-production.jks"
          # Print the public certificate identity (proves WHICH production key signed this build).
          keytool -list -v -keystore "$RUNNER_TEMP/zevora-production.jks" -storepass "$SP" 2>/dev/null \
            | grep -E "Alias name|Owner:" || true
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/zevora-production.jks"
            echo "STORE_PASSWORD=$SP"
            echo "KEY_ALIAS=$AL"
            echo "KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon clean assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          test "${PIPESTATUS[0]}" -eq 0
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             "release/ZEVORA-v${{ steps.meta.outputs.name }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "release/ZEVORA-latest.apk"

      - name: Upload Gradle failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevora-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      # The uploaded log needs auth to download; mirror the key error lines as
      # check annotations so failures stay diagnosable from the public API.
      - name: Surface build errors as annotations
        if: failure()
        run: |
          LOG="${{ runner.temp }}/gradle-build.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::gradle-build.log was not produced (gradle never ran)"
            exit 0
          fi
          echo "--- gradle-build.log: $(wc -l < "$LOG") lines, $(wc -c < "$LOG") bytes ---"
          grep -E "^e: |FAILED|Execution failed|Caused by|Could not|FAILURE:|error:" "$LOG" \
            | head -n 20 | while IFS= read -r line; do
              line="$(echo "$line" | head -c 900 | sed 's/%/%25/g')"
              echo "::error::$line"
            done
          echo "--- last 25 lines of gradle log ---"
          tail -n 25 "$LOG" || true

      - name: Verify APK against the current source code
        run: |
          python3 scripts/verify_apk.py \
            --apk "release/ZEVORA-v${{ steps.meta.outputs.name }}-release.apk" \
            --expect-version-code "${{ steps.meta.outputs.code }}" \
            --expect-version-name "${{ steps.meta.outputs.name }}" \
            --source-commit "${{ steps.meta.outputs.commit }}" \
            --report release/VERIFICATION_REPORT.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEVORA-v${{ steps.meta.outputs.name }}-release
          path: |
            release/*.apk
            release/VERIFICATION_REPORT.md
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          body: |
            ZEVORA v${{ steps.meta.outputs.name }} (versionCode ${{ steps.meta.outputs.code }})

            Built from commit `${{ steps.meta.outputs.commit }}` by this workflow and
            verified against the source tree before publishing (`scripts/verify_apk.py`:
            the top speaker icon is absent from `VideoPlayerViewKt`, the bottom audio
            control `feed_mute_button` is present, the 3.0.0 rebuild markers are in DEX,
            pre-rebuild mock/backdoor markers are absent, and `BuildConfig.GIT_COMMIT` matches).

            Signed with the stable production key from GitHub Secrets (APK Signature
            Scheme v2+v3), so future updates install over this build without uninstall.
          files: |
            release/*.apk
            release/VERIFICATION_REPORT.md
