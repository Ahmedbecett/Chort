name: Android Release APK

# Builds, signs and verifies a release APK straight from the pushed commit, then
# publishes it as a downloadable artifact (and attaches it to the GitHub Release
# when a v* tag is pushed). This is why a stale APK can no longer be shipped:
# the artifact is rebuilt from source on every release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the commit stamp is meaningful)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installed manually instead of via a third-party action: the SDK tools are
      # pinned so the runner cannot silently pick a cmdline-tools build that
      # requires a newer JDK (that broke an earlier run of this workflow).
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          rm -rf "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.1.0" \
            "build-tools;36.0.0"

      - name: Read version + commit
        id: meta
        run: |
          echo "code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure isolated release signing
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/zevora-release.jks" \
            -storepass "zevora-build-only" \
            -keypass "zevora-build-only" \
            -alias "zevora" \
            -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=ZEVORA Build,O=ZEVORA"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/zevora-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=zevora-build-only" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=zevora" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=zevora-build-only" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon clean assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          test "${PIPESTATUS[0]}" -eq 0
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             "release/ZEVORA-v${{ steps.meta.outputs.name }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk \
             "release/ZEVORA-latest.apk"

      - name: Upload Gradle failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zevora-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      - name: Verify APK against the current source code
        run: |
          python3 scripts/verify_apk.py \
            --apk "release/ZEVORA-v${{ steps.meta.outputs.name }}-release.apk" \
            --expect-version-code "${{ steps.meta.outputs.code }}" \
            --expect-version-name "${{ steps.meta.outputs.name }}" \
            --source-commit "${{ steps.meta.outputs.commit }}" \
            --report release/VERIFICATION_REPORT.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEVORA-v${{ steps.meta.outputs.name }}-release
          path: |
            release/*.apk
            release/VERIFICATION_REPORT.md
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          body: |
            ZEVORA v${{ steps.meta.outputs.name }} (versionCode ${{ steps.meta.outputs.code }})

            Built from commit `${{ steps.meta.outputs.commit }}` by this workflow and
            verified against the source tree before publishing (`scripts/verify_apk.py`:
            the top speaker icon is absent from `VideoPlayerViewKt`, the bottom audio
            control `feed_mute_button` is present, and `BuildConfig.GIT_COMMIT` matches).

            Signed with an ephemeral CI build key (`CN=ZEVORA Build`, APK Signature Scheme v2+v3). Production Play signing must be supplied separately when publishing to Play Console.
            If a previous build signed with the debug key is installed, uninstall it once
            before installing this APK.
          files: |
            release/*.apk
            release/VERIFICATION_REPORT.md
