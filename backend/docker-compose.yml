version: '3.8'

services:
  # 1. Primary PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tokpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: tokpulse_admin
      POSTGRES_PASSWORD: pulse_secure_pass
      POSTGRES_DB: tokpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokpulse_admin -d tokpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Cache, Feed Caching, BullMQ Queue, Rate-Limiting)
  redis:
    image: redis:7-alpine
    container_name: tokpulse-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. S3-Compatible Object Storage (MinIO for video & avatar assets)
  minio:
    image: minio/minio:latest
    container_name: tokpulse-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 4. Backend REST API Server
  api:
    build: .
    container_name: tokpulse-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://tokpulse_admin:pulse_secure_pass@postgres:5432/tokpulse_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tokpulse-videos
      S3_ACCESS_KEY_ID: minio_admin
      S3_SECRET_ACCESS_KEY: minio_secure_password
      S3_FORCE_PATH_STYLE: "true"
      CDN_BASE_URL: http://localhost:9000/tokpulse-videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # 5. Background FFmpeg Transcoding Worker (Scale independently)
  transcoder-worker:
    build: .
    container_name: tokpulse-worker
    command: ["npm", "run", "worker"]
    restart: always
    environment:
      DATABASE_URL: postgresql://tokpulse_admin:pulse_secure_pass@postgres:5432/tokpulse_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tokpulse-videos
      S3_ACCESS_KEY_ID: minio_admin
      S3_SECRET_ACCESS_KEY: minio_secure_password
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      - redis
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
